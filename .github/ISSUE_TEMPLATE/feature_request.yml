name: Feature request
description: Suggest something plugview should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How plugview could help. Keep in mind that plugview aims to stay small and fast.
