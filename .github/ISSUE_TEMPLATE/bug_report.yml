name: Bug report
description: Something does not work, or works worse than expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Capture card
      placeholder: e.g. UGREEN 25773, Elgato Cam Link 4K
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: plugview and macOS versions
      description: Output of `plugview --version` and `sw_vers -productVersion`, and Apple silicon or Intel.
      placeholder: plugview 0.1.0, macOS 15.6, Apple silicon
    validations:
      required: true
  - type: textarea
    id: list
    attributes:
      label: Output of `plugview --list`
      render: text
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: Output of `plugview --measure`
      description: Needed for picture, sound, or latency problems.
      render: text
