name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag, version, and changelog agree
        run: |
          version="$(make -s version)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Sources/PlugviewCore/Constants.swift"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint, strict build, tests
        run: make check

      - name: Build universal archive
        run: make dist

      - name: Verify archive
        run: |
          tar -xzf .build/dist/plugview-macos-universal.tar.gz -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/plugview-$VERSION/plugview"
          archs="$(lipo -archs "$binary")"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::not universal: $archs"; exit 1 ;; esac
          test "$("$binary" --version)" = "$VERSION"

      - name: Release notes from CHANGELOG
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          \`\`\`sh
          brew install MauricioLeon54/tap/plugview
          \`\`\`

          Or download \`plugview-macos-universal.tar.gz\` below (Apple silicon and Intel, macOS 14+).
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .build/dist/plugview-macos-universal.tar.gz \
            .build/dist/plugview-macos-universal.tar.gz.sha256 \
            --title "plugview $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
