name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag, version, and changelog agree
        run: |
          version="$(make -s version)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Sources/PlugviewCore/Constants.swift"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint, strict build, tests
        run: make check

      - name: Build universal archives
        run: make dist

      - name: Verify archive
        run: |
          tar -xzf .build/dist/plugview-macos-universal.tar.gz -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/plugview-$VERSION/plugview"
          archs="$(lipo -archs "$binary")"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::not universal: $archs"; exit 1 ;; esac
          test "$("$binary" --version)" = "$VERSION"

      - name: Verify app archive
        run: |
          ditto -x -k .build/dist/plugview-macos-app.zip "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/plugview.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = app.plugview.plugview
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -d "$app/Contents/Resources/plugview_PlugviewUI.bundle"
          archs="$(lipo -archs "$app/Contents/MacOS/plugview")"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::app not universal: $archs"; exit 1 ;; esac
          test "$("$app/Contents/MacOS/plugview" --version)" = "$VERSION"

      - name: Release notes from CHANGELOG
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          The app (also puts the \`plugview\` command on your PATH):

          \`\`\`sh
          brew install --cask plugview/tap/plugview
          \`\`\`

          Only the command:

          \`\`\`sh
          brew install plugview/tap/plugview
          \`\`\`

          Or download \`plugview-macos-app.zip\` (the app) or \`plugview-macos-universal.tar.gz\` (the command)
          below. Both are universal (Apple silicon and Intel) and need macOS 14 or later.

          plugview is not notarized yet, so macOS blocks the app the first time it opens: open
          **System Settings › Privacy & Security** and click **Open Anyway**. Until then macOS also stops the
          \`plugview\` command the cask installs. Each update asks for camera and microphone access again.
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .build/dist/plugview-macos-universal.tar.gz \
            .build/dist/plugview-macos-universal.tar.gz.sha256 \
            .build/dist/plugview-macos-app.zip \
            .build/dist/plugview-macos-app.zip.sha256 \
            --title "plugview $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
