[package]
name = "plugview"
description = "plugview for Linux: plug in a capture card, play"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
gio = "0.22"
glib = "0.22"
gst = { version = "0.25", package = "gstreamer" }
gst_video = { version = "0.25", package = "gstreamer-video" }
gstgtk4 = { version = "0.15", package = "gst-plugin-gtk4", features = ["gtk_v4_16"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
pango = { version = "0.22", features = ["v1_56"] }
pangocairo = "0.22"
plugview-core = { path = "../plugview-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Linux: hand dmabufs to GTK (zero copy, graphics offload) and share GL with Wayland or X11.
[target.'cfg(target_os = "linux")'.dependencies]
gstgtk4 = { version = "0.15", package = "gst-plugin-gtk4", features = ["gtk_v4_16", "dmabuf", "wayland", "x11egl", "x11glx"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
